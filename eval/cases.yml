      - source_path: sso/books/ISLRv2_corrected_June_2023.pdf
        pages: [214, 216]
      - source_path: sso/books/ISLP_website.pdf
        pages: [214, 216]

  - id: islr-kfold-bias-variance
    course_slug: sso
    question: waarom kiest men vaak k=5 of k=10 bij cross-validation?
