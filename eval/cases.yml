# De evalset. Verwachtingen wijzen naar source_path + paginabereik uit de
# bladwijzers van het boek (de inhoudsopgave van de uitgever), nooit naar wat
# retrieval toevallig teruggaf. Zie eval/README.md.
#
# SSO heeft twee edities van hetzelfde boek: ISLR (R) en ISLP (Python). De
# paginering verschilt per hoofdstuk een paar bladzijden, dus elke case noemt
# beide, elk met het bereik uit zijn eigen bladwijzers. Een treffer in één van
# beide telt.
cases:
  # ---- SSO: An Introduction to Statistical Learning (ISLR 2e / ISLP) ----
  - id: islr-bias-variance
    course_slug: sso
    question: wat is de bias-variance tradeoff?
    expected:
      - source_path: sso/books/ISLRv2_corrected_June_2023.pdf
        pages: [44, 46]
      - source_path: sso/books/ISLP_website.pdf
        pages: [41, 43]

  - id: islr-kfold
    course_slug: sso
    question: hoe werkt k-fold cross-validation?
